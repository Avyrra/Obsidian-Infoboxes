
name: Build Infoboxes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Package plugin
        uses: actions/upload-artifact@v4
        with:
          name: infoboxes-test-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
